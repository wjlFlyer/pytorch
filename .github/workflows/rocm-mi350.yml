# Owner(s): ["module: rocm"]
# DEBUG (badpod-scan): neutered to scan the gfx950.2 pool for the broken-KFD-
# topology failure and validate the distributed RCCL pre-flight gate's fast-fail
# path. No build -- the test pulls a prebuilt trunk wheel from S3 (see
# _rocm-test.yml "Download build artifacts"). DO NOT MERGE.
name: rocm-mi350

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # Fan out N identical distributed shards on the gfx950.2 pool. Each lands on a
  # different ARC ephemeral pod, so one dispatch is N chances to hit a pod with
  # the broken KFD topology and watch the pre-flight gate fail fast (seconds)
  # instead of the shard hanging. `attempt` only makes the matrix entries
  # distinct. config=distributed so the pre-flight gate fires.
  scan:
    if: github.repository_owner == 'pytorch'
    name: gfx950.2-badpod-scan
    uses: ./.github/workflows/_rocm-test.yml
    with:
      build-environment: linux-jammy-rocm-py3.10-mi350
      docker-image: ci-image:pytorch-linux-jammy-rocm-n-py3
      test-matrix: |
        { include: [
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 1 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 2 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 3 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 4 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 5 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 6 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 7 },
          { config: "distributed", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.2", attempt: 8 },
        ]}
    secrets: inherit
